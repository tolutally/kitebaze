<!DOCTYPE html>
<html class="staticrypt-html" lang="en">
    <head>
        <meta charset="utf-8" />
        <meta name="robots" content="noindex, nofollow">
        <title>Your Kitebaze plan</title>
        <meta name="viewport" content="width=device-width, initial-scale=1" />

        <!-- do not cache this page -->
        <meta http-equiv="cache-control" content="max-age=0" />
        <meta http-equiv="cache-control" content="no-cache" />
        <meta http-equiv="expires" content="0" />
        <meta http-equiv="expires" content="Tue, 01 Jan 1980 1:00:00 GMT" />
        <meta http-equiv="pragma" content="no-cache" />

        <style>
            .staticrypt-hr {
                margin-top: 20px;
                margin-bottom: 20px;
                border: 0;
                border-top: 1px solid #eee;
            }

            .staticrypt-page {
                width: 360px;
                padding: 8% 0 0;
                margin: auto;
                box-sizing: border-box;
            }

            .staticrypt-form {
                position: relative;
                z-index: 1;
                background: #ffffff;
                max-width: 360px;
                margin: 0 auto 100px;
                padding: 45px;
                text-align: center;
                box-shadow: 0 0 20px 0 rgba(0, 0, 0, 0.2), 0 5px 5px 0 rgba(0, 0, 0, 0.24);
            }

            .staticrypt-form input[type="password"],
            input[type="text"] {
                background: inherit;
                border: 0;
                box-sizing: border-box; /* This ensures padding is included in the total width */
                font-size: 14px;
                outline: 0;
                padding: 15px 30px 15px 15px; /* Adjust the padding to ensure there is space for the icon */
                width: 100%;
            }

            .staticrypt-password-container {
                position: relative;
                outline: 0;
                background: #f2f2f2;
                width: 100%;
                border: 0;
                margin: 0 0 15px;
                box-sizing: border-box;
            }

            .staticrypt-toggle-password-visibility {
                cursor: pointer;
                height: 20px;
                opacity: 60%;
                padding: 13px;
                position: absolute;
                right: 0;
                top: 50%;
                transform: translateY(-50%);
                width: 20px;
            }

            .staticrypt-form .staticrypt-decrypt-button {
                text-transform: uppercase;
                outline: 0;
                background: #17191f;
                width: 100%;
                border: 0;
                padding: 15px;
                color: #ffffff;
                font-size: 14px;
                cursor: pointer;
            }

            .staticrypt-form .staticrypt-decrypt-button:hover,
            .staticrypt-form .staticrypt-decrypt-button:active,
            .staticrypt-form .staticrypt-decrypt-button:focus {
                background: #17191f;
                filter: brightness(92%);
            }

            .staticrypt-html {
                height: 100%;
            }

            .staticrypt-body {
                height: 100%;
                margin: 0;
            }

            .staticrypt-content {
                height: 100%;
                margin-bottom: 1em;
                background: #faf8f1;
                font-family: "Arial", sans-serif;
                -webkit-font-smoothing: antialiased;
                -moz-osx-font-smoothing: grayscale;
            }

            .staticrypt-instructions {
                margin-top: -1em;
                margin-bottom: 1em;
            }

            .staticrypt-title {
                font-size: 1.5em;
            }

            label.staticrypt-remember {
                display: flex;
                align-items: center;
                margin-bottom: 1em;
            }

            .staticrypt-remember input[type="checkbox"] {
                transform: scale(1.5);
                margin-right: 1em;
            }

            .hidden {
                display: none !important;
            }

            .staticrypt-spinner-container {
                height: 100%;
                display: flex;
                align-items: center;
                justify-content: center;
            }

            .staticrypt-spinner {
                display: inline-block;
                width: 2rem;
                height: 2rem;
                vertical-align: text-bottom;
                border: 0.25em solid gray;
                border-right-color: transparent;
                border-radius: 50%;
                -webkit-animation: spinner-border 0.75s linear infinite;
                animation: spinner-border 0.75s linear infinite;
                animation-duration: 0.75s;
                animation-timing-function: linear;
                animation-delay: 0s;
                animation-iteration-count: infinite;
                animation-direction: normal;
                animation-fill-mode: none;
                animation-play-state: running;
                animation-name: spinner-border;
            }

            @keyframes spinner-border {
                100% {
                    transform: rotate(360deg);
                }
            }

            @media screen and (-webkit-min-device-pixel-ratio: 0) {
                .staticrypt-form input[type="password"],
                input[type="text"] {
                    font-size: 16px;
                }
            }

            @import url("https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500&family=Inter:wght@300;400;500&display=swap");
            .staticrypt-html,.staticrypt-body{background:#faf8f1!important;font-family:"Inter","Segoe UI",system-ui,sans-serif;color:#17191f}
            .staticrypt-content{background:#faf8f1!important;background-image:radial-gradient(ellipse 80% 420px at 50% 0,#fbf0e6,transparent 70%)!important}
            .staticrypt-page{max-width:420px!important;padding:12vh 16px 0!important}
            .staticrypt-form{background:#fff!important;border:1px solid #e5e3dd;border-radius:24px!important;box-shadow:0 18px 55px rgba(0,0,0,.08)!important;padding:32px 28px!important;max-width:none!important}
            .kb-logo{display:flex;align-items:center;justify-content:center;gap:8px;margin:0 auto 22px;font:500 22px "Space Grotesk","Segoe UI",sans-serif;letter-spacing:-.03em;color:#17191f}
            .kb-mark{width:22px;height:22px;color:#9f6b4e}
            .staticrypt-title{font-family:"Space Grotesk","Segoe UI",sans-serif!important;font-weight:500!important;font-size:26px!important;letter-spacing:-.035em;line-height:1.1;color:#17191f;margin:0 0 8px!important}
            .staticrypt-instructions p{color:#55575d;font-weight:300;font-size:15px;line-height:1.55}
            .staticrypt-hr{border:0!important;border-top:1px solid #e5e3dd!important;margin:18px 0!important}
            .staticrypt-form input[type="password"],.staticrypt-form input[type="text"]{border:1px solid #c8c6c1!important;border-radius:9999px!important;padding:14px 18px!important;font-size:16px!important;background:#fff!important;color:#17191f!important;font-family:inherit}
            .staticrypt-form input:focus{outline:2px solid #9f6b4e;outline-offset:2px}
            .staticrypt-form .staticrypt-decrypt-button{border-radius:9999px!important;padding:14px 18px!important;font-family:inherit;font-weight:500!important;font-size:15px!important;text-transform:none!important;letter-spacing:0!important}
            .staticrypt-form .staticrypt-decrypt-button:hover{background:#87583f!important}
            label.staticrypt-remember{color:#55575d;font-size:14px}
            .kb-foot{margin-top:18px;text-align:center;font-size:12.5px;color:#66686e}
        </style>
    </head>
